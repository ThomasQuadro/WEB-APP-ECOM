services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexusbuild
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexuspass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusbuild"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://nexus:nexuspass@db:5432/nexusbuild
      JWT_SECRET: nexus-jwt-super-secret-change-in-production
      FRONTEND_URL: http://localhost:5173
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: .
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
